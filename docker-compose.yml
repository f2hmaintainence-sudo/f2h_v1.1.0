name: f2hfresh

services:
  api:
    container_name: f2h_api_service
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    command: npm run start:dev
    ports:
      - "5001:5001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5001
      - Backend_Port=5001
      - DB_CONNECTION=postgresql
      - DB_HOST=f2hfresh.com
      - DB_PORT=5432
      - DB_DATABASE=f2h_fresh
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - BACKEND_URL=http://localhost:5001
      - APP_URL=http://localhost:3000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Secrets are read from an untracked .env — see .env.example. They used to be
      # literals here, which meant working JWT/session/encryption keys were published
      # in git. Rotate anything that ever used the old values.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?ENCRYPTION_SECRET is required}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - path: ./apps/api/.env
        required: false
    depends_on:
      - redis
    restart: unless-stopped

  web:
    container_name: f2h_web_service
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:5002"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5001
      - INTERNAL_API_URL=http://api:5001
    depends_on:
      - api
    restart: unless-stopped

  redis:
    container_name: f2h_redis_service
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped


