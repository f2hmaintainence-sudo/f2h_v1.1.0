android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false

# Disable persistent daemon to prevent native memory accumulation on Windows
org.gradle.daemon=false

# Optimized JVM memory for 7GB RAM Windows system
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:CICompilerCount=2 -XX:ParallelGCThreads=2 -XX:+UseG1GC
kotlin.daemon.jvm.options=-Xmx256m -XX:+UseG1GC

# Restrict parallel workers to 1 to prevent native memory exhaustion
org.gradle.workers.max=1
org.gradle.parallel=false

# Flutter migrator flags
android.builtInKotlin=false
android.newDsl=false
