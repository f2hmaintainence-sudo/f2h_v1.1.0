android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false

# Disable persistent daemon to prevent native memory accumulation on Windows
org.gradle.daemon=false

# Standard JVM memory for Windows system
# org.gradle.jvmargs=-Xmx1024m
kotlin.daemon.jvm.options=-Xmx256m

# Restrict parallel workers to 1 to prevent native memory exhaustion
org.gradle.workers.max=1
org.gradle.parallel=false

# Flutter migrator flags
android.builtInKotlin=false
android.newDsl=false
