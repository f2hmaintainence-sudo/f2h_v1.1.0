<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta name="google-signin-client_id" content="842214638527-l1fj6ut97ct6gif1rljm1c63h3k31i6r.apps.googleusercontent.com">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="F2H Fresh - Farm to Home fresh dairy, fruits, vegetables and groceries.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="F2H Fresh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>F2H Fresh</title>
  <link rel="manifest" href="manifest.json">
  <!-- Material Icons Font for Web -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #FFFFFF;
    }
    flutter-view, flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
    }
    @font-face {
      font-family: 'MaterialIcons';
      font-style: normal;
      font-weight: 400;
      src: url('assets/fonts/MaterialIcons-Regular.otf') format('opentype'),
           url('fonts/MaterialIcons-Regular.otf') format('opentype'),
           url('https://fonts.gstatic.com/s/materialicons/v142/flUhRq6tzZclQEJ-Vdg-IuiaDsNcIhQ8tQ.woff2') format('woff2');
    }
    @font-face {
      font-family: 'MaterialIconsOutlined';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.gstatic.com/s/materialiconsoutlined/v110/gok-H73ffCoq9YBgvTuZtfwizMT5TDl4ji5u.woff2') format('woff2'),
           url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
    }
    @font-face {
      font-family: 'MaterialIconsRound';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.gstatic.com/s/materialiconsround/v109/LDItaoyNOAY6Uewc665JcIzCKsKc_M9ETg.woff2') format('woff2'),
           url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
    }
    @font-face {
      font-family: 'MaterialIconsSharp';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.gstatic.com/s/materialiconssharp/v111/oPWQ_RxloXcMoHitUZRh3695O3LcarEZfc4.woff2') format('woff2'),
           url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
    }
    /* Modern F2H Splash Loader */
    #f2h-web-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #F0FDF4 0%, #FFFFFF 85%);
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #f2h-web-splash.f2h-fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .f2h-splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
      max-width: 320px;
    }
    .f2h-logo-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: #FFFFFF;
      box-shadow: 0 12px 32px rgba(16, 185, 129, 0.18), 0 2px 6px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: f2h-pulse 2.4s ease-in-out infinite;
    }
    .f2h-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 16px;
    }
    .f2h-fallback-icon {
      font-size: 42px;
      line-height: 1;
    }
    .f2h-brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #065F46;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    .f2h-brand-sub {
      font-size: 13px;
      font-weight: 500;
      color: #059669;
      margin-bottom: 24px;
      letter-spacing: 0.2px;
    }
    .f2h-bar-container {
      width: 170px;
      height: 4px;
      background: #E5E7EB;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .f2h-bar-value {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, #10B981, #059669);
      border-radius: 99px;
      animation: f2h-indeterminate 1.5s ease-in-out infinite;
    }
    .f2h-status {
      font-size: 12px;
      color: #6B7280;
      font-weight: 500;
      min-height: 18px;
    }
    .f2h-reload-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: #10B981;
      color: #FFFFFF;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }
    @keyframes f2h-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes f2h-indeterminate {
      0% { left: -50%; width: 50%; }
      50% { left: 25%; width: 60%; }
      100% { left: 100%; width: 50%; }
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <!-- Instant HTML/CSS Brand Splash (Eliminates Blank White Screen) -->
  <div id="f2h-web-splash">
    <div class="f2h-splash-card">
      <div class="f2h-logo-wrap">
        <img src="icons/Icon-192.png" alt="F2H Fresh" class="f2h-logo" onerror="this.style.display='none'; document.getElementById('f2h-fallback-icon').style.display='block';">
        <div id="f2h-fallback-icon" class="f2h-fallback-icon" style="display:none;">🌿</div>
      </div>
      <div class="f2h-brand-title">F2H Fresh</div>
      <div class="f2h-brand-sub">Farm to Home Freshness</div>
      <div class="f2h-bar-container">
        <div class="f2h-bar-value"></div>
      </div>
      <div id="f2h-splash-status" class="f2h-status">Starting F2H Fresh...</div>
    </div>
  </div>

  <script>
    // 1. Force unregister any stale service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // 2. Dynamic status progression for smooth user feedback
    const statusEl = document.getElementById('f2h-splash-status');
    const timer1 = setTimeout(() => { if (statusEl) statusEl.innerText = 'Loading modules & assets...'; }, 4000);
    const timer2 = setTimeout(() => { if (statusEl) statusEl.innerText = 'Initializing components...'; }, 10000);
    const timer3 = setTimeout(() => { if (statusEl) statusEl.innerText = 'Almost ready...'; }, 20000);
    const timer4 = setTimeout(() => {
      if (statusEl) {
        statusEl.innerHTML = 'Taking longer than usual?<br><button class="f2h-reload-btn" onclick="location.reload()">Reload App</button>';
      }
    }, 35000);

    // 3. Dismiss splash smoothly once Flutter mounts its view or renders first frame
    let splashDismissed = false;
    function dismissSplash() {
      if (splashDismissed) return;
      splashDismissed = true;
      clearTimeout(timer1);
      clearTimeout(timer2);
      clearTimeout(timer3);
      clearTimeout(timer4);
      const splash = document.getElementById('f2h-web-splash');
      if (splash) {
        splash.classList.add('f2h-fade-out');
        setTimeout(() => splash.remove(), 450);
      }
    }

    window.addEventListener('flutter-first-frame', dismissSplash);

    // MutationObserver fallback to catch when Flutter DOM mounts
    const observer = new MutationObserver(() => {
      const flutterView = document.querySelector('flutter-view, flt-glass-pane');
      if (flutterView) {
        observer.disconnect();
        // Give a frame for content to paint
        requestAnimationFrame(() => setTimeout(dismissSplash, 120));
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 4. Catch unexpected startup errors
    window.addEventListener('error', function(e) {
      console.error('[F2H Startup Error]', e);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
