[databases]
__PGBOUNCER_DB_NAME__ = host=__PGBOUNCER_DB_HOST__ port=__PGBOUNCER_DB_PORT__ dbname=__PGBOUNCER_DB_NAME__

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer
pidfile = /var/run/pgbouncer/pgbouncer.pid
logfile = /var/log/pgbouncer/pgbouncer.log

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = __PGBOUNCER_DB_USER__
stats_users = __PGBOUNCER_DB_USER__

pool_mode = __PGBOUNCER_POOL_MODE__
max_client_conn = __PGBOUNCER_MAX_CLIENT_CONN__
default_pool_size = __PGBOUNCER_DEFAULT_POOL_SIZE__
min_pool_size = __PGBOUNCER_MIN_POOL_SIZE__
reserve_pool_size = __PGBOUNCER_RESERVE_POOL_SIZE__
reserve_pool_timeout = 3
server_idle_timeout = __PGBOUNCER_SERVER_IDLE_TIMEOUT__
server_connect_timeout = 5
query_wait_timeout = 120
max_db_connections = __PGBOUNCER_MAX_DB_CONNECTIONS__
max_user_connections = __PGBOUNCER_MAX_USER_CONNECTIONS__
ignore_startup_parameters = extra_float_digits,options
server_reset_query = DISCARD ALL
server_reset_query_always = 0
max_prepared_statements = 0

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
